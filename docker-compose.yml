# Base de datos local para desarrollo. Misma familia que Hostinger (MariaDB).
# Uso: docker compose up -d   → luego npm run dev
services:
  db:
    image: mariadb:10.11
    container_name: ecolife-sync-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ecolife_sync
      MARIADB_USER: ecolife_sync
      MARIADB_PASSWORD: ecolife_sync
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
